<table class="table analysis-table">
    <colgroup>
      <col class="analysis-col-category" />
      <col class="analysis-col-count" />
      <col class="analysis-col-pctdeck" />
      <col class="analysis-col-pge1" />
      <col class="analysis-col-ge" />
      <col class="analysis-col-ge" />
      <col class="analysis-col-ge" />
      <col class="analysis-col-ge" />
      <col class="analysis-col-ge" />
    </colgroup>
    <thead>
      <tr>
        <th scope="col" title="Engine, catégorie ou groupe">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">Ligne</span>
            <span class="analysis-th-hint">Engine / catégorie / groupe</span>
          </span>
        </th>
        <th scope="col" title="Nombre de cartes du groupe dans le Main Deck">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">Nb</span>
            <span class="analysis-th-hint">Cartes</span>
          </span>
        </th>
        <th scope="col" title="Part du Main Deck">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">% Deck</span>
            <span class="analysis-th-hint">Part du Main</span>
          </span>
        </th>
        <th scope="col" title="P(≥1) pour le nombre de cartes piochées (5 ou 6, ou deck restant si simulation)">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">≥1</span>
            <span class="analysis-th-hint">Tirage actif</span>
          </span>
        </th>
        <th scope="col" title="P(≥2), même tirage que la colonne ≥1">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">≥2</span>
            <span class="analysis-th-hint">Même tirage</span>
          </span>
        </th>
        <th scope="col" title="P(≥3), même tirage">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">≥3</span>
            <span class="analysis-th-hint">Même tirage</span>
          </span>
        </th>
        <th scope="col" title="P(≥4), même tirage">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">≥4</span>
            <span class="analysis-th-hint">Même tirage</span>
          </span>
        </th>
        <th scope="col" title="P(≥5), même tirage">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">≥5</span>
            <span class="analysis-th-hint">Même tirage</span>
          </span>
        </th>
        <th scope="col" title="P(≥6) : utile surtout pour une main à 6 cartes (sinon « — »)">
          <span class="analysis-th-stack">
            <span class="analysis-th-label">≥6</span>
            <span class="analysis-th-hint">Main 6</span>
          </span>
        </th>
      </tr>
    </thead>
    <tbody id="category-summary-body">
      <!-- lignes dynamiques -->
    </tbody>
</table>
