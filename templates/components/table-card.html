<div class="deck-sections">
  <div class="deck-section main-deck-section" data-deck-zone="main">
    <h3 class="deck-section-title" data-deck-action="toggle-zone" tabindex="0" role="button" aria-expanded="true">
      <span>MAIN DECK <span class="deck-section-count" id="deck-main-count">0</span><span class="deck-section-max"> / 60</span></span>
      <button type="button" class="deck-section-toggle" aria-label="Replier ou déplier la zone">▼</button>
    </h3>
    <div class="deck-section-body">
      <div class="deck-cards-grid" id="deck-main-grid"></div>
    </div>
  </div>
  <div class="deck-section extra-deck-section" data-deck-zone="extra">
    <h3 class="deck-section-title" data-deck-action="toggle-zone" tabindex="0" role="button" aria-expanded="true">
      <span>EXTRA DECK <span class="deck-section-count" id="deck-extra-count">0</span><span class="deck-section-max"> / 15</span></span>
      <button type="button" class="deck-section-toggle" aria-label="Replier ou déplier la zone">▼</button>
    </h3>
    <div class="deck-section-body">
      <div class="deck-cards-grid" id="deck-extra-grid"></div>
    </div>
  </div>
  <div class="deck-section side-deck-section" data-deck-zone="side">
    <h3 class="deck-section-title" data-deck-action="toggle-zone" tabindex="0" role="button" aria-expanded="true">
      <span>SIDE DECK <span class="deck-section-count" id="deck-side-count">0</span><span class="deck-section-max"> / 15</span></span>
      <button type="button" class="deck-section-toggle" aria-label="Replier ou déplier la zone">▼</button>
    </h3>
    <div class="deck-section-body">
      <div class="deck-cards-grid" id="deck-side-grid"></div>
    </div>
  </div>
</div>
