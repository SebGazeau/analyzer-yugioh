<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Admin Password Reset Queue</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #0f172a; color: #e2e8f0; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
    button { margin-right: 8px; }
    .small { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Queue reset mot de passe</h1>
  <p class="small">Admin approuve en présentiel puis émet un code temporaire (téléphone).</p>
  <table>
    <thead>
      <tr>
        <th>Request ID</th>
        <th>Pseudo</th>
        <th>Path</th>
        <th>Status</th>
        <th>Attempts</th>
        <th>Expires</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="queue-body"></tbody>
  </table>
  <pre id="log"></pre>
  <script>
    const body = document.getElementById("queue-body");
    const log = document.getElementById("log");
    function setLog(msg){ log.textContent = msg; }
    async function call(url, payload){
      const r = await fetch(url, { method: "POST", headers: { "Content-Type":"application/json" }, body: JSON.stringify(payload)});
      const txt = await r.text();
      setLog(`${url} -> ${r.status}\n${txt}`);
      if (!r.ok) throw new Error("request failed");
    }
    async function approve(id){
      await call(`/admin/password-reset/${id}/approve`, { verification_method: "in_person", notes: "validated in person" });
      await load();
    }
    async function issue(id){
      await call(`/admin/password-reset/${id}/issue-temp-code`, { ttl_minutes: 15 });
      await load();
    }
    async function load(){
      const resp = await fetch("/admin/password-reset/queue");
      const data = await resp.json();
      body.innerHTML = "";
      for (const item of (data.items || [])) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.pseudo}</td>
          <td>${item.path}</td>
          <td>${item.status}</td>
          <td>${item.attempt_count}</td>
          <td>${new Date(item.expires_at).toLocaleString()}</td>
          <td>
            <button data-act="approve">Approve</button>
            <button data-act="issue">Issue code</button>
          </td>
        `;
        tr.querySelector('[data-act="approve"]').addEventListener("click", () => approve(item.id));
        tr.querySelector('[data-act="issue"]').addEventListener("click", () => issue(item.id));
        body.appendChild(tr);
      }
    }
    load().catch((e) => setLog(String(e)));
  </script>
</body>
</html>
