<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Admin – Premier compte</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <section class="admin-panel">
      <h1 class="admin-title">Créer le premier compte admin</h1>
      <p class="admin-subtitle">Renseigne email, mot de passe et clé de setup (<code>ADMIN_SECRET</code>).</p>
      <form method="post" action="/admin/setup" class="admin-form-grid">
        <label>Email <input name="email" type="email" required placeholder="admin@example.com"></label>
        <label>Mot de passe <input name="password" type="password" autocomplete="off" required></label>
        <label>Clé de setup <input name="setup_key" type="password" autocomplete="off" required></label>
        <button type="submit">Créer le compte</button>
      </form>
      <p class="btn-row"><a class="admin-btn admin-btn-secondary" href="/admin/login">Retour à la connexion</a></p>
    </section>
  </div>
</body>
</html>
