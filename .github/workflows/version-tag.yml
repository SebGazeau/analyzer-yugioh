# À chaque push sur main/master : incrémente la version (Cargo.toml + Cargo.lock),
# commit « chore(release): bump … » et pousse le tag vX.Y.Z → déclenche Deploy GCP.
#
# Évite la boucle : ignore les commits dont le message commence par chore(release): bump
#
# Déclenchement manuel : choix patch / minor / major (sans nouveau push sur la branche).

name: Version & tag

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Incrément semver"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: version-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): bump'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Version actuelle (Cargo.toml)
        id: current
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="analyzer-yugioh") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Current version: $v"

      - name: Prochaine version
        id: next
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          IFS=. read -r major minor patch <<< "$CURRENT"
          case "$BUMP" in
            patch) n="$major.$minor.$((patch + 1))";;
            minor) n="$major.$((minor + 1)).0";;
            major) n="$((major + 1)).0.0";;
            *) echo "bump invalide: $BUMP" >&2; exit 1;;
          esac
          echo "next=$n" >> "$GITHUB_OUTPUT"
          echo "Next version: $n (bump=$BUMP)"

      - name: Appliquer la version
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: cargo run -p xtask --bin bump-cargo-version -- "$NEXT"

      - name: Mettre à jour Cargo.lock
        run: cargo check

      - name: Commit & tag & push
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to ${NEXT}"
          git tag -a "v${NEXT}" -m "v${NEXT}"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          git push origin "refs/tags/v${NEXT}"
